title: Aram Koukia
tagline: Software alchemist, engineering leader, professional smile-maker.
description: >-
  Aram Koukia is an engineering leader at AWS who writes about technical
  leadership, scalable systems, and building teams that love what they do.
author: Aram Koukia
# Matches the custom domain in CNAME.
url: "https://koukia.ca"
baseurl: ""
# Optional: path to a square photo, e.g. /assets/img/aram.jpg. Falls back to a monogram.
avatar:

# Shown in the footer and used by SEO tags. Delete any you don't use.
social:
  github: aramkoukia
  linkedin: aram-koukia

# Topics shown first in the home page filter, in this order. The rest follow by post count.
featured_tags:
  - Leadership
  - AI
  - Product & Agile
  - AWS

plugins:
  - jekyll-feed
  - jekyll-seo-tag

permalink: /:year/:month/:title/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - tools/
  - README.md
  - Gemfile
  - Gemfile.lock
  - medium-export/
