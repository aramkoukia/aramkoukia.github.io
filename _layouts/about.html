---
layout: default
---
{% assign p = site.data.profile %}
<section class="page-hero about-hero">
  <div class="wrap about-grid">
    {% include avatar.html %}
    <div>
      <h1>{{ p.name }} <span class="pron">/{{ p.pronounce }}/</span></h1>
      <p class="lede">{{ p.headline }}</p>
      {% include social.html %}
    </div>
  </div>
</section>

<div class="wrap about-body">
  <article class="prose about-prose">
    {{ content }}
  </article>
</div>
