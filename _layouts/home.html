---
layout: default
---
<section class="page-hero">
  <div class="wrap">
    <h1>Clarity <em>at altitude.</em></h1>
    <p class="lede">Notes on leadership, systems and scale. Written by <a href="{{ '/about/' | relative_url }}">{{ site.author }}</a>.</p>
  </div>
</section>

<section class="writing">
  <div class="wrap">
    <div class="writing-head">
      <h2>All posts <span class="count">{{ site.posts.size }}</span></h2>
      <label class="filter">
        <span class="sr">Filter posts</span>
        <input id="filter" type="search" placeholder="Filter by title or topic" autocomplete="off">
      </label>
    </div>
    {% include post-list.html %}
    <p id="empty" class="empty" hidden>No posts match “<span></span>”. Try a shorter search term.</p>
  </div>
</section>
