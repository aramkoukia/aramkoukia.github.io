name: Rebuild scheduled posts

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request a GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${GITHUB_REPOSITORY}/pages/builds
